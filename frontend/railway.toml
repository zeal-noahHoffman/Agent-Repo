# Railway config for the dashboard frontend, when deployed as its own service
# with the root directory set to `frontend`. Uses Nixpacks (auto-runs
# `npm ci` + `npm run build`); `serve` hosts the static build on $PORT.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
